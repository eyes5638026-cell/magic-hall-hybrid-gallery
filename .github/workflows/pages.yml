name: Publish the gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package the site
        env:
          FIREBASE_WEB_CONFIGURATION: ${{ secrets.FIREBASE_WEB_CONFIGURATION }}
        run: |
          mkdir _site
          cp -R index.html hall.css hall.js artwork-tags.css artwork-tags.js firebase-artwork.js assets data _site/
          printf '%s\n' "$FIREBASE_WEB_CONFIGURATION" > _site/firebase-config.js
          test -s _site/firebase-config.js
          node --check _site/firebase-config.js
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
